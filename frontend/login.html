<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — EchoLens</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            background-color: var(--bg-main);
            overflow: hidden;
        }

        .login-card {
            background-color: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 44px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 10;
        }

        .login-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
        }

        .login-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--dark-text);
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: var(--secondary-text);
            line-height: 1.4;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--dark-text);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background-color: var(--surface);
            font-size: 0.95rem;
            color: var(--dark-text);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary-brown);
        }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--secondary-text);
            cursor: pointer;
            font-weight: 500;
        }

        .forgot-link {
            color: var(--secondary-text);
            text-decoration: underline;
            font-weight: 600;
        }

        .forgot-link:hover {
            color: var(--primary-brown);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--secondary-text);
            font-size: 0.82rem;
            font-weight: 600;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--border-color);
        }

        .login-footer {
            text-align: center;
            font-size: 0.88rem;
            color: var(--secondary-text);
        }

        .login-footer a {
            color: var(--primary-brown);
            font-weight: 700;
        }

        .bg-leaf {
            position: absolute;
            bottom: -60px;
            right: -40px;
            width: 260px;
            opacity: 0.2;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div style="width: 100%; display: flex; justify-content: flex-start; margin-bottom: 8px;">
                    <a href="index.html" class="btn btn-outline" style="font-size: 0.85rem; padding: 6px 12px; gap: 6px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        Back to Home
                    </a>
                </div>
                <a href="index.html" class="logo" style="margin-bottom: 8px;">
                    <svg class="logo-icon" viewBox="0 0 24 24">
                        <path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20c9 0 14-11 14-11M17 8A18.5 18.5 0 0 0 2 3c0 9 6.5 14.5 10 14.5"/>
                    </svg>
                    EchoLens
                </a>
                <h1 class="login-title">Welcome back</h1>
                <p class="login-subtitle">Sign in to continue to your product intelligence workspace.</p>
            </div>

            <form id="loginForm" style="display: flex; flex-direction: column; gap: 16px;">
                <div class="form-group">
                    <label class="form-label" for="email">Email address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@company.com" required value="koushik@echolens.io">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required value="password123">
                </div>

                <div class="form-row">
                    <label class="checkbox-label">
                        <input type="checkbox" checked style="accent-color: var(--primary-brown);"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="padding: 12px; font-size: 1rem; margin-top: 8px;">
                    Sign In
                </button>
            </form>

            <div class="divider">or</div>

            <button type="button" class="btn btn-secondary" onclick="handleDemoLogin()" style="padding: 12px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/>
                </svg>
                Continue with Google
            </button>

            <div class="login-footer">
                Don't have an account? <a href="#" onclick="handleDemoLogin()">Create account</a>
            </div>
        </div>

        <svg class="bg-leaf" viewBox="0 0 100 100" fill="var(--primary-brown)">
            <path d="M50,10 C70,30 90,60 50,90 C10,60 30,30 50,10 Z"/>
        </svg>
    </div>

    <script>
        function handleDemoLogin() {
            localStorage.setItem('echolens_user', JSON.stringify({
                name: 'koushik',
                role: 'Product Team',
                email: 'koushik@echolens.io'
            }));
            window.location.href = 'upload.html';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            handleDemoLogin();
        });
    </script>
</body>
</html>
